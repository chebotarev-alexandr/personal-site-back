services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: site
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DATABASE_URL: postgres://site:site@db:5432/site
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      LEAD_NOTIFY_EMAIL: ${LEAD_NOTIFY_EMAIL:-}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

volumes:
  pgdata:
  media:
